<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta http-equiv="refresh" content="3;url=https://rifasolidariarodrigo.github.io/">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rifa Solidária do Rodrigo</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
/* VOICE: aviso curto e confiável
   IDEA: placa de "mudamos de endereço"
   PICTURE: o novo endereço em destaque, grande
   COLOUR and TYPE: azul #0f3460, amarelo #ffc93c; Archivo + Inter
   LAYOUT: uma tela, centralizada */
:root{color-scheme:light dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0f3460;color:#fff;font:17px/1.55 Inter,system-ui,sans-serif;padding:24px}
.box{max-width:560px;text-align:center}
.tag{display:inline-block;background:#ffc93c;color:#0f3460;font-weight:700;padding:6px 14px;border-radius:99px;font-size:14px;margin-bottom:18px}
h1{font-family:Archivo,sans-serif;font-weight:800;font-size:clamp(30px,6vw,46px);line-height:1.08;margin:0 0 14px;text-wrap:balance}
p{color:#d6e2f0;margin:0 0 22px}
.url{font-family:Archivo,sans-serif;font-size:clamp(22px,5vw,30px);font-weight:700;color:#ffc93c;word-break:break-all;margin-bottom:22px}
a.btn{display:inline-flex;align-items:center;justify-content:center;min-height:54px;padding:0 28px;border-radius:14px;background:#ffc93c;color:#0f3460;font-weight:700;font-size:18px;text-decoration:none}
a.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
small{display:block;margin-top:22px;color:#b9cbe0;font-size:14px}
</style>
</head>
<body>
<main class="box">
  <span class="tag">Rifa solidária · sorteio 20/12/2026 às 10h</span>
  <h1>A rifa do Rodrigo mudou de endereço</h1>
  <p>Para escolher seus números e concorrer à Smart TV TCL 55", acesse o site oficial:</p>
  <div class="url">rifasolidariarodrigo.github.io</div>
  <a class="btn" href="https://rifasolidariarodrigo.github.io/">Ir para a rifa</a>
  <small>PIX somente no nome de Rodrigo Martins de Matos.</small>
</main>
</body>
</html>
